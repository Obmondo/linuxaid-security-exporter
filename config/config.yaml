vuls_server:
  url: "https://vulsserver.example"
  timeout: 30s
  cert_file: "/etc/puppetlabs/puppet/ssl/certs/<certname>.pem"
  key_file: "/etc/puppetlabs/puppet/ssl/private_keys/<certname>.pem"
  ca_file: "/etc/puppetlabs/puppet/ssl/certs/ca.pem"
listen_address: "127.254.254.254:63396"
scan_interval: 12h
# keep serving metrics this long after a Vuls connectivity failure, then exit for a systemd restart
upstream_retry_delay: 6h
# random_delay: 1h  # max random startup delay (default 1h, set to 0s to disable)
