vuls_server:
  url: "https://vulsserver.example"
  timeout: 30s
  cert_file: "/etc/puppetlabs/puppet/ssl/certs/<certname>.pem"
  key_file: "/etc/puppetlabs/puppet/ssl/private_keys/<certname>.pem"
  ca_file: "/etc/puppetlabs/puppet/ssl/certs/ca.pem"
listen_address: "127.254.254.254:63396"
scan_interval: 12h
# keep serving metrics this long after a Vuls connectivity failure, then exit for a systemd restart
upstream_retry_delay: 6h
# random_delay: 1h  # max random startup delay (default 1h; 0s also means the default)
# scan the system mounted under this root instead of the one the exporter runs
# on: dpkg-query and rpm are pointed at its database, so a container needs only
# the node's /etc/os-release and /var/lib/dpkg (or /var/lib/rpm) mounted
# host_root: /host
# name of the host inside a shared certificate, e.g. a Kubernetes node; defaults
# to $NODE_NAME
# node_name: node-1
