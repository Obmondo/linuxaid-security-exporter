name: Build package

# Build the deb/rpm packages on every push and PR, exactly as release.yaml
# does on a tag, but as a snapshot that is not published or uploaded. This
# catches a broken release pipeline before a tag is cut.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-package:
    name: Build package (snapshot, no upload)
    runs-on: ubuntu-24.04-htzhel1-ax42-a
    steps:
      - name: Checkout
        uses: https://gitea.obmondo.com/Obmondo/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: https://gitea.obmondo.com/Obmondo/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build packages with GoReleaser
        uses: https://gitea.obmondo.com/Obmondo/goreleaser-action@v7.3.0
        with:
          version: "v2.12.7"
          args: release --snapshot --clean --skip=publish,announce,validate -f .goreleaser-gitea.yaml

      - name: List packages
        run: ls -alh dist/*.deb dist/*.rpm
